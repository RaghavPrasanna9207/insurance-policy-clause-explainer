[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # PyMuPDF's SWIG bindings emit these on import; not actionable by us.
    ignore:builtin type Swig.*:DeprecationWarning
    ignore:builtin type swigvarlink.*:DeprecationWarning
markers =
    llm: requires a running Ollama server (deselect with '-m "not llm"')
