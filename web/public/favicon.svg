  <g stroke="#1A1815" stroke-width="2" stroke-linecap="square">
    <path d="M7 9h18M7 15h18M7 27h11"/>
  </g>
  <path d="M7 21h18" stroke="#A8321E" stroke-width="2" stroke-linecap="square"/>
</svg>
